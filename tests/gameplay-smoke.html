<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Air Juggler — synthetic-hand test</title>
<link rel="stylesheet" href="../css/styles.css">
<p id="test-status">Loading the actual game UI with a synthetic hand…</p>
<script type="module">
// Reuse production markup and modules; never request a camera or save test scores.
const response = await fetch('../index.html');
const page = new DOMParser().parseFromString(await response.text(), 'text/html');
document.body.replaceChildren(...page.body.childNodes);
const banner = document.createElement('div');
banner.style.cssText = 'padding:12px;text-align:center;background:#d7fa76';
banner.textContent = 'TEST MODE · Synthetic fingertip · No camera or saved scores. ';
const remove = document.createElement('button');
remove.textContent = 'Remove test hand';
banner.append(remove);
const drop = document.createElement('button');
drop.textContent = 'Drop test ball';
banner.append(drop);
document.body.prepend(banner);
const { HandOverlay } = await import('../js/overlay.js');
const { GameAudio } = await import('../js/audio.js');
const { GameFeedback } = await import('../js/feedback.js');
const { GameLoop } = await import('../js/game-loop.js');
const { elements, renderState, renderScores, renderRound, flashScore, announceLevel, clearFeedback, renderSound, renderModeSelection } = await import('../js/ui.js');
const overlay = new HandOverlay(elements.canvas, { videoWidth: 800, videoHeight: 600 });
const audio = new GameAudio();
const feedback = new GameFeedback(audio, flashScore, announceLevel);
let present = true;
let state = 'idle';
let selectedMode = 'normal';
const bests = { easy: 0, normal: 0, hard: 0, timed: 0 };
let best = 0;
let previousBest = 0;
const loop = new GameLoop(overlay, (next, details) => {
  if (state !== next) { state = next; renderState(state); }
  renderRound(state, details, best, previousBest);
  feedback.update(state, details);
  if (['paused', 'game-over', 'life-lost'].includes(state)) clearFeedback();
}, (score) => { best = Math.max(best, score); bests[selectedMode] = best; renderScores(score, best); });
function start() {
  feedback.reset();
  clearFeedback();
  present = true;
  remove.textContent = 'Remove test hand';
  previousBest = best;
  state = 'waiting';
  renderState(state);
  loop.start(selectedMode);
}
elements.start.onclick = () => {
  if (state === 'idle') start();
  else { loop.stop(); feedback.reset(); clearFeedback(); state = 'idle'; renderState(state); renderModeSelection(selectedMode, (id) => bests[id]); }
};
elements.restart.onclick = start;
elements.pause.onclick = () => loop.paused ? loop.resume() : loop.pause();
elements.sound.onclick = async () => {
  if (audio.muted) {
    const enabled = await audio.enable();
    renderSound(audio.muted, !enabled);
  } else { audio.mute(); renderSound(true); }
};
remove.onclick = () => {
  present = !present;
  remove.textContent = present ? 'Remove test hand' : 'Restore test hand';
};
drop.onclick = () => { if (loop.game.status === 'playing') loop.game.ball.y = 650; };
const timer = setInterval(() => {
  loop.setHand(present ? { keypoints: [{ name: 'index_finger_tip', x: 400, y: 470 }] } : null);
}, 50);
window.addEventListener('pagehide', () => { clearInterval(timer); loop.stop(); audio.mute(); });
document.querySelector('#mode-options').onchange = (event) => {
  if (state !== 'idle') return;
  selectedMode = event.target.value;
  best = bests[selectedMode];
  renderModeSelection(selectedMode, (id) => bests[id]);
  renderScores(0, best);
};
renderModeSelection(selectedMode, (id) => bests[id]);
renderScores(0, 0);
renderState('idle');
renderSound(true);
</script>
</html>
