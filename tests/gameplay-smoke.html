<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Air Juggler gameplay smoke test</title>
<style>
body { font: 16px sans-serif; background: #f4f5ef; color: #202b28; margin: 24px; }
canvas { display: block; width: min(800px, 100%); aspect-ratio: 4 / 3; background: #202b28; border-radius: 16px; margin: 20px 0; }
button { padding: 12px; margin: 8px; }
</style>
<h1>Gameplay smoke test</h1>
<p>A synthetic fingertip exercises the real renderer and game loop without camera access.</p>
<p id="state" role="status"></p><p id="score"></p>
<button id="restart">Start / Restart</button><button id="remove">Remove hand</button><button id="stop">Stop</button>
<canvas width="800" height="600"></canvas>
<script type="module">
import { HandOverlay } from '../js/overlay.js';
import { GameLoop } from '../js/game-loop.js';
const canvas = document.querySelector('canvas');
const overlay = new HandOverlay(canvas, { videoWidth: 800, videoHeight: 600 });
let present = true;
const loop = new GameLoop(overlay,
  (state) => { document.querySelector('#state').textContent = `State: ${state}`; },
  (score) => { document.querySelector('#score').textContent = `Score: ${score}`; });
const timer = setInterval(() => {
  loop.setHand(present ? { keypoints: [{ name: 'index_finger_tip', x: 400, y: 470 }] } : null);
}, 50);
document.querySelector('#restart').onclick = () => { present = true; loop.start(); };
document.querySelector('#remove').onclick = () => { present = false; };
document.querySelector('#stop').onclick = () => { loop.stop(); document.querySelector('#state').textContent = 'State: stopped'; };
window.addEventListener('pagehide', () => { clearInterval(timer); loop.stop(); });
loop.start();
</script>
</html>
